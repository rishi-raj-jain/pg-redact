<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0c0d0d"/>
  <g fill="#00e599">
    <!-- ears, fanning out and tapering to a soft point -->
    <path d="M11.8 8 C6.5 6 1.5 8.8 1.5 14 C1.5 18.8 5 21.5 9.5 20 C10 16 10.4 11.5 11.8 8 Z"/>
    <path d="M20.2 8 C25.5 6 30.5 8.8 30.5 14 C30.5 18.8 27 21.5 22.5 20 C22 16 21.6 11.5 20.2 8 Z"/>
    <!-- head with a domed forehead -->
    <circle cx="16" cy="12" r="6"/>
    <!-- trunk: long, tapering, hanging down and curling right -->
    <path d="M14 15 C12.5 19.5 12.4 25 14.6 27.8 C15.7 29.2 18 28.6 18.4 26.8 C18.9 24 18.5 18.5 18.3 15 Z"/>
  </g>
  <!-- tusks curving down into the gaps beside the trunk -->
  <path d="M14.3 21.5 C13.4 23.2 12.4 24.6 11.4 25.6" stroke="#f4fff9" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M17.7 21.5 C18.6 23.2 19.6 24.6 20.6 25.6" stroke="#f4fff9" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- redaction bar over the eyes -->
  <rect x="7.5" y="9.4" width="17" height="4" rx="1.5" fill="#0c0d0d"/>
</svg>
